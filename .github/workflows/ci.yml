name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcb-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A pull request's github.sha is a merge commit, not the PR's head.
      - name: Name the artifacts after the commit
        run: echo "SHORT_SHA=${HEAD_SHA::7}" >> "$GITHUB_ENV"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check the layout
        run: python3 scripts/check_layout.py
      - name: Build headless FreeCAD image
        run: docker build -t freecad-headless -f scripts/freecad.Dockerfile scripts
      - name: Export PCB mock STL
        run: |
          mkdir -p pcb
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_pcb.py --pass pcb/kbdkid5_Pcb_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_pcb.py --pass pcb/kbdkid5_Pcb_Right.stl right
      - name: Upload PCB mock STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-pcb-stl-${{ env.SHORT_SHA }}
          path: pcb/
          if-no-files-found: error
      - name: Export switch plate STL
        run: |
          mkdir -p plate
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_plate.py --pass plate/kbdkid5_Plate_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_plate.py --pass plate/kbdkid5_Plate_Right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_plate.py --pass plate/kbdkid5_Plate_Left_Covered.stl covered
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_plate.py --pass plate/kbdkid5_Plate_Right_Covered.stl \
            right covered
      - name: Upload switch plate STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-plate-stl-${{ env.SHORT_SHA }}
          path: plate/
          if-no-files-found: error
      - name: Export fused mock, slit test and socket test STL
        run: |
          mkdir -p mock
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_mock.py --pass mock/kbdkid5_Mock_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_mock.py --pass mock/kbdkid5_Mock_Right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_slit_test.py --pass mock/kbdkid5_Slit_Test.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_slit_test.py --pass mock/kbdkid5_Slit_Test_Wide.stl wide
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_socket_test.py --pass mock/kbdkid5_Socket_Test_Pocket.stl \
            pocket
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_socket_test.py --pass mock/kbdkid5_Socket_Test_Lip.stl lip
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_socket_test.py --pass mock/kbdkid5_Socket_Test_Backing.stl \
            backing
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_socket_test.py --pass mock/kbdkid5_Socket_Test_Holes.stl \
            holes
      - name: Upload fused mock, slit test and socket test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-mock-stl-${{ env.SHORT_SHA }}
          path: mock/
          if-no-files-found: error
      - name: Export tray, nano clamp tab and nano bay test STL
        run: |
          mkdir -p tray
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_tray.py --pass tray/kbdkid5_Tray_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_tray.py --pass tray/kbdkid5_Tray_Right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_clamp_tab.py --pass tray/kbdkid5_Nano_Clamp_Tab.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_nano_bay_test.py --pass tray/kbdkid5_Nano_Bay_Test.stl
      - name: Upload tray, nano clamp tab and nano bay test STL
        uses: actions/upload-artifact@v4
        with:
          name: kbdkid5-tray-stl-${{ env.SHORT_SHA }}
          path: tray/
          if-no-files-found: error
