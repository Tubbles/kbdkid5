name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcb-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the layout
        run: python3 scripts/check_layout.py
      - name: Build headless FreeCAD image
        run: docker build -t freecad-headless -f scripts/freecad.Dockerfile scripts
      - name: Export PCB mock STL
        run: |
          mkdir -p pcb
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_pcb.py --pass pcb/kbdkid5_Pcb_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_pcb.py --pass pcb/kbdkid5_Pcb_Right.stl right
      - name: Upload PCB mock STL
        uses: actions/upload-artifact@v4
        with:
          name: pcb-stl
          path: pcb/
          if-no-files-found: error
      - name: Export switch plate STL
        run: |
          mkdir -p plate
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_plate.py --pass plate/kbdkid5_Plate_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_plate.py --pass plate/kbdkid5_Plate_Right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_plate.py --pass plate/kbdkid5_Plate_Left_Covered.stl covered
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_plate.py --pass plate/kbdkid5_Plate_Right_Covered.stl \
            right covered
      - name: Upload switch plate STL
        uses: actions/upload-artifact@v4
        with:
          name: plate-stl
          path: plate/
          if-no-files-found: error
      - name: Export fused mock and slit test STL
        run: |
          mkdir -p mock
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_mock.py --pass mock/kbdkid5_Mock_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_mock.py --pass mock/kbdkid5_Mock_Right.stl right
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_slit_test.py --pass mock/kbdkid5_Slit_Test.stl
      - name: Upload fused mock and slit test STL
        uses: actions/upload-artifact@v4
        with:
          name: mock-stl
          path: mock/
          if-no-files-found: error
      - name: Export tray STL
        run: |
          mkdir -p tray
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_tray.py --pass tray/kbdkid5_Tray_Left.stl
          docker run --rm -v "$PWD":/work -w /work freecad-headless \
            freecadcmd scripts/export_tray.py --pass tray/kbdkid5_Tray_Right.stl right
      - name: Upload tray STL
        uses: actions/upload-artifact@v4
        with:
          name: tray-stl
          path: tray/
          if-no-files-found: error
